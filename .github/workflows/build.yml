name: Build REACH IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_only:
        description: 'Build package only after UI checks have passed for the same app code'
        type: boolean
        default: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          elif [ -d /Applications/Xcode_26.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.app
          fi
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify fitness logic and quote library
        run: |
          swiftc Reach/Engine.swift Reach/QuoteLibrary.swift Tests/main.swift -o /tmp/reach-tests
          mkdir -p output
          /tmp/reach-tests | tee output/core-tests.txt
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project Reach.xcodeproj -scheme Reach -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/Reach.app output/Payload/
          cd output
          zip -qr REACH-1.1.ipa Payload
          shasum -a 256 REACH-1.1.ipa > SHA256.txt
      - name: Simulator UI checks
        if: ${{ !inputs.package_only }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "$DEVICE" > simulator.txt
          xcodebuild -project Reach.xcodeproj -scheme Reach -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO -resultBundlePath UITestResults.xcresult test 2>&1 | tee uitest.log
      - name: Export screen captures
        if: ${{ always() && !inputs.package_only }}
        run: |
          if [ -d UITestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path UITestResults.xcresult --output-path output/screenshots
            python3 tools/preview.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REACH-delivery
          path: |
            output/REACH-1.1.ipa
            output/SHA256.txt
            output/REACH-preview.png
            output/core-tests.txt
            output/screenshots/
            build.log
            uitest.log
            UITestResults.xcresult
          retention-days: 14
